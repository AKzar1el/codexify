name: Build experimental Codexify hot reload for Windows

on:
  push:
    branches:
      - feat/per-mcp-hot-reload-20261119
      - fix/per-chat-playwright-hotreload-20261122
      - feat/browser-profile-manager-20261128
      - fix/browser-profile-manager-main-20261128
    paths:
      - .github/workflows/preview-hot-reload-windows.yml
      - src/markdown_chat/mod.rs
      - src/agent_automation/install.rs
      - src/bridge.rs
      - src/bridge/**
      - src/mcp_catalog.rs
      - src/playwright_sessions.rs

permissions:
  contents: read

jobs:
  preview-windows:
    name: Package pinned Windows feature binary
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        if: github.ref_name == 'feat/browser-profile-manager-20261128' || github.ref_name == 'fix/browser-profile-manager-main-20261128'
        with:
          node-version: '22'
      - name: Real headless Chrome profile isolation and handoff
        if: github.ref_name == 'feat/browser-profile-manager-20261128' || github.ref_name == 'fix/browser-profile-manager-main-20261128'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = Join-Path $env:RUNNER_TEMP 'codexify-pinned-playwright'
          npm install --prefix $fixture --ignore-scripts --no-audit --no-fund '@playwright/mcp@0.0.86'
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Playwright MCP install failed' }
          $entry = Join-Path $fixture 'node_modules/@playwright/mcp/cli.js'
          if (!(Test-Path -LiteralPath $entry -PathType Leaf)) { throw 'Pinned MCP entry missing' }
          $env:CODEXIFY_TEST_PLAYWRIGHT_MCP_ENTRY = $entry
          cargo test --release --locked --lib named_profiles_real_chrome_canary -- --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Real Chrome canary failed' }
      - name: Build from exact branch commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release --locked --bin codexify
          if ($LASTEXITCODE -ne 0) { throw 'Cargo build failed' }
          $out = Join-Path $env:RUNNER_TEMP 'codexify-hot-reload-preview'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $binary = Join-Path (Get-Location) 'target\release\codexify.exe'
          if (!(Test-Path -LiteralPath $binary -PathType Leaf)) { throw 'Expected executable missing' }
          Copy-Item -LiteralPath $binary -Destination (Join-Path $out 'codexify.exe')
          & (Join-Path $out 'codexify.exe') --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Preview binary self-probe failed' }
          $hash = (Get-FileHash -LiteralPath (Join-Path $out 'codexify.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath (Join-Path $out 'SHA256SUMS.txt') -Value ("$hash  codexify.exe") -Encoding ascii
          Set-Content -LiteralPath (Join-Path $out 'SOURCE_COMMIT.txt') -Value "${{ github.sha }}" -Encoding ascii
          Set-Content -LiteralPath (Join-Path $out 'PREVIEW_NOTICE.txt') -Value 'EXPERIMENTAL binary from an isolated integration branch. Not an official release. Do not replace the running service or existing browser profiles; coordinate a separately authorized rollout.' -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name == 'fix/browser-profile-manager-main-20261128' && 'codexify-main-profile-manager-windows-preview' || (github.ref_name == 'feat/browser-profile-manager-20261128' && 'codexify-pr14-profile-manager-windows-preview' || 'codexify-pr12-perchat-hotreload-windows-preview') }}
          path: ${{ runner.temp }}/codexify-hot-reload-preview/*
          if-no-files-found: error
          retention-days: 7
