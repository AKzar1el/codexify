name: Scoped Playwright and hot-reload integration checks

on:
  push:
    branches:
      - fix/per-chat-playwright-hotreload-20261122
      - feat/browser-profile-manager-20261128
    paths:
      - .github/workflows/perchat-integration-validation.yml
      - src/bridge.rs
      - src/bridge/**
      - src/playwright_sessions.rs
      - scripts/fixtures/hot-reload-stdio-mcp.mjs
      - src/mcp_catalog.rs
      - src/upstream_control.rs

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  scoped-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Per-task browser session tests
        run: |
          cargo test --locked --lib playwright_sessions:: -- --test-threads=1
      - name: Hot reload and real two-owner stdio tests
        run: |
          cargo test --locked --lib bridge::hot_reload_tests:: -- --test-threads=1
