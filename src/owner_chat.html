<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codexify chats</title>
<style>
:root { color-scheme:light dark; --bg:#f5f7f6; --panel:#fff; --ink:#202427; --muted:#6b7475; --line:#dce2df; --accent:#136f50; --selected:#e4f3ed; }
@media(prefers-color-scheme:dark) { :root { --bg:#171b1a; --panel:#202625; --ink:#edf1ef; --muted:#aab5b1; --line:#39423f; --accent:#82d9b1; --selected:#174c3e; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
button { font:inherit; cursor:pointer; }
#layout { display:grid; grid-template-columns:minmax(245px,300px) minmax(0,1fr); height:100dvh; min-height:420px; }
aside { display:flex; flex-direction:column; min-height:0; background:var(--panel); border-right:1px solid var(--line); }
aside header { padding:20px 18px 14px; border-bottom:1px solid var(--line); }
aside h1 { margin:0; font-size:17px; }
aside p { margin:5px 0 0; font-size:12px; color:var(--muted); }
#conversations { overflow:auto; flex:1; padding:8px; }
.conversation { display:grid; grid-template-columns:20px minmax(0,1fr) 8px; gap:9px; align-items:center; width:100%; padding:11px 9px; text-align:left; color:inherit; border:0; border-radius:10px; background:transparent; }
.conversation:hover { background:var(--bg); }
.conversation[aria-current="true"] { background:var(--selected); }
.conversation:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
.presence { display:grid; place-items:center; width:13px; height:13px; flex:none; border-radius:50%; }
.presence svg { display:block; width:13px; height:13px; }
.presence.online { background:#159b27; border-color:#159b27; color:white; }
.presence.away { background:#eba916; border-color:#eba916; color:white; }
.presence.offline { color:#85898d; background:#fff; }
.presence.waiting { color:#c4313b; }
@media(prefers-color-scheme:dark) { .presence.waiting { color:#ff858e; } }
.conversation-main { min-width:0; }
.conversation-title { display:block; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-weight:600; }
.conversation-detail { display:block; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-size:11px; color:var(--muted); margin-top:3px; }
.unread { width:7px; height:7px; background:#2488d3; border-radius:50%; }
.unread[hidden] { display:none; }
#list-note { padding:10px 16px; border-top:1px solid var(--line); color:var(--muted); font-size:11px; }
main { min-width:0; min-height:0; display:flex; justify-content:center; padding:18px; }
#chat-host { width:min(100%,960px); min-height:0; background:var(--panel); border:1px solid var(--line); border-radius:18px; overflow:hidden; display:flex; flex-direction:column; }
#placeholder { display:grid; place-items:center; height:100%; color:var(--muted); padding:24px; text-align:center; }
#error { color:#ad2d30; padding:10px 16px; font-size:12px; }
input,select,textarea { font:inherit; }
#chat-search { width:100%; margin-top:14px; padding:8px 10px; border:1px solid var(--line); border-radius:9px; background:var(--bg); color:var(--ink); }
#list-view { display:flex; gap:4px; margin-top:9px; }
#list-view button { flex:1; padding:6px 8px; border:0; border-radius:7px; color:var(--muted); background:transparent; font-size:12px; }
#list-view button[aria-pressed="true"] { background:var(--selected); color:var(--ink); }
.project-heading { margin:14px 9px 4px; font-size:12px; font-weight:600; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chat-shell { flex:1; min-height:0; }
@media(max-width:680px) { #layout { grid-template-columns:minmax(145px,33%) minmax(0,1fr); } main { padding:0; } #chat-host { border:0; border-radius:0; } .conversation { grid-template-columns:16px minmax(0,1fr) 7px; gap:5px; padding:9px 5px; } aside header { padding:12px 8px; } aside h1 { font-size:14px; } #list-view { flex-direction:column; } }
</style>
</head>
<body>
<div id="layout">
  <aside aria-label="Conversations">
    <header><h1>Agent chats</h1><input id="chat-search" type="search" aria-label="Search chats" placeholder="Search chats…" maxlength="1024"><div id="list-view" aria-label="Chat list view"><button type="button" id="view-projects" aria-pressed="true">Projects</button><button type="button" id="view-recent" aria-pressed="false">Recent</button></div></header>
    <div id="error" hidden></div>
    <nav id="conversations" aria-label="Agent chat conversations"></nav>
    <div id="list-note">Search names and conversation content. Use Rename chat to save a name.</div>
  </aside>
  <main><div id="chat-host"><div id="placeholder">Select a conversation to view its chat.</div></div></main>
</div>
<template id="owner-composer-style"><style>
.footer { position:relative; border-top:0; padding:12px 18px 10px; background:var(--surface); }
#composer { display:grid; grid-template-columns:minmax(0,1fr) 38px; gap:10px; padding:14px; border:1px solid var(--border); border-radius:25px; background:var(--bg); box-shadow:0 2px 8px #00000006; }
#draft { grid-column:1/-1; width:100%; min-height:56px; border:0; border-radius:0; padding:2px 5px; background:transparent; }
#chat[data-awaiting="true"] #draft { border:0; box-shadow:none; }
#send { grid-column:2; grid-row:2; background:var(--ink); color:var(--bg); }
#composer-tools { grid-column:1; grid-row:2; display:flex; align-items:center; gap:5px; min-width:0; flex-wrap:wrap; }
#composer-tools select { max-width:100%; min-width:0; border:0; border-radius:7px; padding:5px 3px; color:var(--ink); background:transparent; font:inherit; cursor:pointer; }
#automation-effort { color:var(--muted) !important; }
#composer-tools select:disabled { cursor:default; opacity:.65; }
.composer-button { border:0; border-radius:7px; padding:5px 7px; background:transparent; color:var(--muted); font:inherit; cursor:pointer; }
.composer-button:hover { background:var(--agent); }
#automation-settings-toggle { margin-right:auto; }
#goal-bar { display:flex; align-items:center; gap:8px; margin:0 16px -10px; padding:10px 12px 18px; border:1px solid var(--border); border-bottom:0; border-radius:18px 18px 0 0; }
#goal-caption { white-space:nowrap; font-weight:500; }
#goal-text { flex:1; min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; color:var(--muted); }
#goal-bar button { flex:none; padding:3px; display:grid; place-items:center; }
#goal-bar svg { width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
#automation-settings,#goal-editor { position:absolute; bottom:calc(100% - 8px); left:18px; right:18px; max-height:60dvh; overflow:auto; z-index:5; padding:16px; border:1px solid var(--border); border-radius:16px; background:var(--surface); box-shadow:0 8px 24px #0002; }
.automation-heading { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
.automation-heading strong { font-size:14px; }
.automation-detail { margin:6px 0; color:var(--muted); font-size:12px; overflow-wrap:anywhere; }
.automation-actions { display:flex; flex-wrap:wrap; gap:7px; margin:8px 0; }
.automation-actions button { padding:6px 9px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--ink); font:inherit; }
.automation-actions button:disabled { opacity:.5; }
.automation-field { display:block; margin:10px 0 5px; color:var(--muted); font-size:12px; }
#automation-url,#automation-goal,#chat-name { width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--ink); font:inherit; }
#automation-goal { min-height:90px; resize:vertical; }
#automation-notice { margin:7px 4px 0; color:var(--muted); font-size:11px; }
#automation-error { color:var(--error); margin:8px 4px; font-size:12px; }
#rename-form { padding:12px 18px; border-bottom:1px solid var(--border); }
#rename-form label { display:block; margin-bottom:5px; }
#rename-form p { color:var(--muted); font-size:12px; margin:5px 0; }
#rename-chat svg { width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.7; }
[hidden] { display:none !important; }
@media(max-width:480px) { .footer { padding:10px 8px; } #composer { padding:10px; } #goal-bar { margin-left:8px; margin-right:8px; gap:5px; font-size:12px; } #goal-caption { max-width:90px; overflow:hidden; text-overflow:ellipsis; } #automation-settings,#goal-editor { left:8px; right:8px; } #composer-tools { gap:2px; font-size:12px; } }
</style></template>
<!-- CHAT_TEMPLATE -->
<script>
/* CHAT_SCRIPT */
(() => {
  "use strict";
  const token = location.hash.slice(1) || sessionStorage.getItem("owner-chat-token");
  if (token) sessionStorage.setItem("owner-chat-token", token);
  const list = document.getElementById("conversations");
  const host = document.getElementById("chat-host");
  const errorNode = document.getElementById("error");
  const search = document.getElementById("chat-search");
  let selected = null, controller = null, chats = [], clockOffset = 0, presenceTimer = null;
  let listMode = "projects", matchedIds = null, matchedQuery = "", searchTimer = null, listRequest = 0, pendingList = null;
  try { if (localStorage.getItem("owner-chat-list-view-v1") === "recent") listMode = "recent"; } catch {}
  const chatIdPattern = /^[0-9a-f]{64}$/;
  const chatMeta = "io.github.devnoname120/codexify/markdown-chat";
  let seen = {};
  try { seen = JSON.parse(localStorage.getItem("owner-chat-seen-v1") || "{}"); } catch {}

  function showError(message) { errorNode.hidden = !message; errorNode.textContent = message || ""; }
  function remember(id, end) {
    if (!Number.isSafeInteger(end) || end <= (seen[id] || 0)) return;
    seen[id] = end;
    try { localStorage.setItem("owner-chat-seen-v1", JSON.stringify(seen)); } catch {}
    renderList();
  }
  function presence(lastCall, now, waitingUntil = null) {
    if (Number.isSafeInteger(waitingUntil) && now < waitingUntil) return "waiting";
    if (!Number.isFinite(lastCall) || now - lastCall >= 300000) return "offline";
    if (now - lastCall >= 180000) return "away";
    return "online";
  }
  function presenceIcon(state) {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 24 24"); svg.setAttribute("aria-hidden", "true");
    if (state === "waiting") {
      const path = document.createElementNS(svg.namespaceURI, "path");
      for (const [key, value] of Object.entries({ d:"M20 16a9.5 9.5 0 1 0-4 4l6 2-2-6Z", fill:"currentColor", stroke:"currentColor", "stroke-width":2, "stroke-linejoin":"round" })) path.setAttribute(key, String(value));
      svg.append(path);
      for (const cx of [7, 12, 17]) {
        const dot = document.createElementNS(svg.namespaceURI, "circle");
        for (const [key, value] of Object.entries({ cx, cy:11.5, r:1.3, fill:"var(--panel)" })) dot.setAttribute(key, String(value));
        svg.append(dot);
      }
      return svg;
    }
    const circle = document.createElementNS(svg.namespaceURI, "circle");
    for (const [key,value] of Object.entries({cx:12,cy:12,r:10.5,fill:state === "offline" ? "#fff" : "currentColor",stroke:"currentColor","stroke-width":2.5})) circle.setAttribute(key,String(value));
    circle.style.color = state === "online" ? "#159b27" : state === "away" ? "#eba916" : "#85898d";
    svg.append(circle);
    const path = document.createElementNS(svg.namespaceURI, "path");
    for (const [key,value] of Object.entries({d:state === "online" ? "m6.5 12 3.5 3.5 7.5-8" : state === "away" ? "M12 5.5V12l5.6 3.2" : "m8 8 8 8m0-8-8 8",fill:"none",stroke:state === "offline" ? "#85898d" : "#fff","stroke-width":3,"stroke-linecap":"round","stroke-linejoin":"round"})) path.setAttribute(key,String(value));
    svg.append(path); return svg;
  }
  function textNode(tag, className, text) {
    const node = document.createElement(tag); node.className = className; node.textContent = text; return node;
  }
  async function api(path, options = {}) {
    const response = await fetch(path, {
      ...options,
      headers:{ Authorization:`Bearer ${token}`, ...(options.body ? {"Content-Type":"application/json"} : {}) },
      cache:"no-store"

  }
  function requestId(prefix) {
    const random = globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    return `${prefix}-${random}`;
  }
  function sentenceCase(value) {
    const text = String(value || "").replaceAll("_", " ");
    return text ? text[0].toUpperCase() + text.slice(1) : "Unknown";
  }
  function createAutomationPanel(id, scope) {
    const panel = document.createElement("section");
    panel.id = "automation-panel";
    panel.hidden = true;
    panel.setAttribute("aria-label", "Chat automation");
    panel.innerHTML = `
      <div id="automation-settings" hidden>
        <div class="automation-heading"><strong>Chat connection</strong><button type="button" class="composer-button" id="automation-settings-close" aria-label="Close connection settings">✕</button></div>
        <p id="companion-status" class="automation-detail"></p>
        <div class="automation-actions"><button type="button" id="automation-login">Sign in</button><button type="button" id="automation-capabilities">Refresh models</button><button type="button" id="automation-reveal">Open in ChatGPT</button></div>
        <label class="automation-field" for="automation-url">ChatGPT conversation URL</label>
        <input id="automation-url" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://chatgpt.com/c/…">
        <div class="automation-actions"><button type="button" id="automation-pair">Pair conversation</button><button type="button" id="automation-unlink">Unlink conversation</button></div>
        <p id="pairing-status" class="automation-detail"></p>
        <p class="automation-detail"><span id="automation-presence"></span> · <span id="automation-action"></span> <span id="automation-queue" hidden></span></p>
        <p id="automation-live-status" class="automation-detail"></p>
        <p id="automation-live-commentary" class="automation-detail"></p>
        <p id="automation-live-answer" class="automation-detail"></p>
        <div class="automation-actions"><button type="button" id="automation-cancel-action">Cancel queued action</button><button type="button" id="automation-retry-action">Retry failed action</button></div>
      </div>
      <div id="goal-editor" hidden>
        <div class="automation-heading"><strong>Goal</strong><button type="button" class="composer-button" id="goal-editor-close" aria-label="Close goal editor">✕</button></div>
        <label class="automation-field" for="automation-goal">Goal Markdown</label><textarea id="automation-goal" maxlength="10240" placeholder="Describe the task goal"></textarea>
        <div class="automation-actions"><button type="button" id="automation-set-goal">Set goal</button></div>
        <p id="goal-status" class="automation-detail"></p>
      </div>
      <div id="goal-bar" hidden>
        <span aria-hidden="true">◎</span><span id="goal-caption"></span><span id="goal-text"></span>
        <button type="button" class="composer-button" id="automation-clear-goal" aria-label="Clear goal" title="Clear goal"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 10v7m4-7v7"/></svg></button>
        <button type="button" class="composer-button" id="automation-toggle-goal" aria-label="Run goal" title="Run goal"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path id="goal-toggle-icon" d="m10 8 6 4-6 4Z"/></svg></button>
        <button type="button" class="composer-button" id="automation-edit-goal" aria-label="Edit goal" title="Edit goal"><svg viewBox="0 0 24 24"><path d="m4 16 12-12 4 4-12 12H4ZM14 6l4 4"/></svg></button>
      </div>
      <div id="automation-error" role="alert" hidden></div>`;
    const composer = scope.querySelector("#composer");
    composer.before(panel);
    const tools = document.createElement("div");
    tools.id = "composer-tools";
    tools.hidden = true;
    tools.innerHTML = `<button type="button" class="composer-button" id="automation-settings-toggle" aria-label="Connection settings" title="Connection settings" aria-expanded="false">⚙</button><button type="button" class="composer-button" id="automation-add-goal">Add goal</button><select id="automation-model" aria-label="ChatGPT model"><option value="">Models unavailable</option></select><select id="automation-effort" aria-label="Reasoning effort"><option value="">Effort</option></select>`;
    composer.insertBefore(tools, scope.querySelector("#send"));
    const notice = document.createElement("p"); notice.id = "automation-notice"; notice.hidden = true;
    composer.after(notice);
    const byId = name => scope.querySelector(`#${name}`);
    const nodes = {
      presence:byId("automation-presence"), queue:byId("automation-queue"), action:byId("automation-action"),
      companion:byId("companion-status"), login:byId("automation-login"), capabilities:byId("automation-capabilities"), reveal:byId("automation-reveal"),
      url:byId("automation-url"), pair:byId("automation-pair"), unlink:byId("automation-unlink"), pairing:byId("pairing-status"),
      model:byId("automation-model"), effort:byId("automation-effort"),
      goal:byId("automation-goal"), setGoal:byId("automation-set-goal"), toggleGoal:byId("automation-toggle-goal"), clearGoal:byId("automation-clear-goal"), goalStatus:byId("goal-status"),
      liveStatus:byId("automation-live-status"), liveCommentary:byId("automation-live-commentary"), liveAnswer:byId("automation-live-answer"), cancelAction:byId("automation-cancel-action"), retryAction:byId("automation-retry-action"), error:byId("automation-error")
    };
    let current = null, models = [], closed = false, timer = null, requestInFlight = false, catalogLoaded = false, catalogAttempted = false, loadingModels = false, savingSelection = false, selectionDraft = null, selectionRevision = 0;
    const setError = message => { nodes.error.hidden = !message; nodes.error.textContent = message || ""; };
    const post = async (operation, body = {}) => {
      const response = await api(`/api/chats/${id}/automation/${operation}`, { method:"POST", body:JSON.stringify(body) });
      return response.json();
    };
    const offline = () => presence(current?.presence?.lastAgentCallAtMs, Date.now() + clockOffset, current?.presence?.agentWaitingUntilMs) === "offline";
    function renderEfforts(preferred = (selectionDraft || current?.selection)?.effort) {
      const model = models.find(candidate => candidate.id === nodes.model.value);
      nodes.effort.replaceChildren();
      for (const effort of model?.efforts || []) {
        if (effort.available) nodes.effort.append(new Option(effort.label, effort.id));
      }
      if (!nodes.effort.options.length) {
        const saved = !catalogLoaded ? (selectionDraft || current?.selection)?.effort : null;
        nodes.effort.append(new Option(saved ? "Saved effort" : "Choose effort", saved || ""));
      }
      if ([...nodes.effort.options].some(option => option.value === preferred)) nodes.effort.value = preferred;
    }
    function renderModels() {
      const selected = (selectionDraft || current?.selection)?.model;
      nodes.model.replaceChildren();
      for (const model of models) if (model.efforts.some(effort => effort.available)) nodes.model.append(new Option(model.label, model.id));
      if (!nodes.model.options.length) nodes.model.append(new Option(!catalogLoaded && selected ? "Saved model" : "Models unavailable", !catalogLoaded ? selected || "" : ""));
      else if (!selected || ![...nodes.model.options].some(option => option.value === selected)) nodes.model.prepend(new Option("Choose model", ""));
      if (selected && [...nodes.model.options].some(option => option.value === selected)) nodes.model.value = selected;
      renderEfforts();
    }
    function render(state) {
      current = state;
      panel.hidden = tools.hidden = notice.hidden = !state?.enabled;
      if (!state?.enabled) return;
      const presenceState = presence(state.presence?.lastAgentCallAtMs, Date.now() + clockOffset, state.presence?.agentWaitingUntilMs);
      nodes.presence.textContent = sentenceCase(presenceState);
      nodes.queue.hidden = !Number.isSafeInteger(state.queue?.position);
      nodes.queue.textContent = nodes.queue.hidden ? "" : `· Queue ${state.queue.position} of ${state.queue.total}`;
      nodes.action.textContent = sentenceCase(state.action?.status || state.live?.phase || "idle");
      const companion = state.companion || {};
      nodes.companion.textContent = companion.authenticated ? `Connected · ${sentenceCase(companion.status || "idle")}` : companion.status === "unavailable" ? (companion.detail || "Browser companion is unavailable") : "ChatGPT sign-in required";
      nodes.login.disabled = companion.authenticated === true;
      nodes.capabilities.disabled = companion.authenticated !== true || presenceState !== "offline" || loadingModels || Boolean(companion.activeActionId);
      const pairing = state.pairing || { status:"unpaired" };
      const pairedUrl = pairing.canonicalUrl || pairing.candidateUrl || "";
      if (pairedUrl && scope.activeElement !== nodes.url) nodes.url.value = pairedUrl;
      nodes.pairing.textContent = pairing.status === "verified" ? "Verified" : pairing.status === "unverified" ? (state.action?.status === "queued" ? "Pairing verification queued" : "Verification required") : "Not paired";
      nodes.pair.textContent = pairing.status === "unpaired" ? "Pair conversation" : "Replace pairing";
      nodes.pair.disabled = !nodes.url.value.trim() || !state.selection?.model || !state.selection?.effort;
      nodes.unlink.disabled = pairing.status === "unpaired";
      nodes.reveal.disabled = !pairedUrl;
      if (!savingSelection && scope.activeElement !== nodes.model && scope.activeElement !== nodes.effort) renderModels();
      const locked = presenceState !== "offline" || !companion.authenticated || !catalogLoaded || savingSelection || loadingModels || Boolean(companion.activeActionId);
      nodes.model.disabled = locked || !models.some(model => model.efforts.some(effort => effort.available));
      nodes.effort.disabled = locked || !models.some(model => model.id === nodes.model.value && model.efforts.some(effort => effort.available));
      const explanation = presenceState !== "offline" ? "Model and effort can be changed when the agent is offline." : !companion.authenticated ? "Sign in through connection settings to load available models." : savingSelection ? "Saving model and effort…" : loadingModels ? "Loading available models…" : companion.activeActionId ? "Browser action in progress." : "";
      nodes.model.title = nodes.effort.title = explanation;
      notice.textContent = explanation; notice.hidden = !explanation;
      const goal = state.goal;
      byId("goal-bar").hidden = !goal;
      byId("automation-add-goal").hidden = Boolean(goal);
      byId("goal-caption").textContent = goal?.status === "active" ? "Pursuing goal" : goal?.status === "configured" ? "Goal paused" : `Goal ${goal?.status || ""}`;
      byId("goal-text").textContent = goal?.markdown || "";
      byId("goal-text").title = goal?.blockedReason || goal?.markdown || "";
      if (byId("goal-editor").hidden) nodes.goal.value = goal?.markdown || "";
      nodes.goalStatus.textContent = goal ? sentenceCase(goal.status) + (goal.blockedReason ? ` · ${goal.blockedReason}` : "") : "No goal configured";
      nodes.setGoal.disabled = !nodes.goal.value.trim() || goal?.status === "active";
      nodes.clearGoal.disabled = goal?.status === "active";
      nodes.toggleGoal.disabled = !goal || !["active", "configured"].includes(goal.status);
      const toggleLabel = goal?.status === "active" ? "Pause goal" : "Run goal";
      nodes.toggleGoal.setAttribute("aria-label", toggleLabel); nodes.toggleGoal.title = toggleLabel;
      byId("goal-toggle-icon").setAttribute("d", goal?.status === "active" ? "M9 8v8m6-8v8" : "m10 8 6 4-6 4Z");
      nodes.liveStatus.textContent = state.live?.status || state.action?.lastError || "";
      nodes.liveCommentary.textContent = state.live?.commentary || "";
      nodes.liveAnswer.textContent = state.live?.answer || state.action?.lastStableAnswer || "";
      nodes.cancelAction.disabled = state.action?.status !== "queued" || !state.action?.id;
      nodes.retryAction.disabled = state.action?.status !== "failed" || state.action?.kind === "pair_verify" || !state.action?.id;
      if (state.action?.lastError) setError(state.action.lastError);
    }
    async function loadModels() {
      if (closed || loadingModels || !offline() || !current?.companion?.authenticated || current.companion.activeActionId) return;
      loadingModels = true; catalogAttempted = true; render(current);
      try {
        const catalog = await post("capabilities");
        if (!closed) { models = catalog.models || []; catalogLoaded = true; renderModels(); }
      } finally { loadingModels = false; if (!closed) render(current); }
    }
    async function refreshState({ quiet = false } = {}) {
      if (closed || requestInFlight || savingSelection) return;
      requestInFlight = true;
      const revision = selectionRevision;
      try {
        const state = await (await api(`/api/chats/${id}/automation`)).json();
        if (!closed) {
          if (revision !== selectionRevision && current) state.selection = current.selection;
          if (Number.isSafeInteger(state.serverTimeMs)) clockOffset = state.serverTimeMs - Date.now();
          if (!quiet) setError("");
          if (!state.companion?.authenticated) { models = []; catalogLoaded = false; catalogAttempted = false; }
          render(state);
          if (state.enabled && !catalogAttempted) await loadModels();
        }
      } catch (error) { if (!closed) setError(error.message || "Chat automation state unavailable"); }
      finally { requestInFlight = false; }
    }
    async function run(operation) {
      setError("");
      try { await operation(); if (!closed) await refreshState(); }
      catch (error) { if (!closed) setError(error.message || "Chat automation operation failed"); }
    }
    async function saveSelection() {
      if (!offline() || savingSelection || !nodes.model.value || !nodes.effort.value) return;
      const submitted = selectionDraft || { model:nodes.model.value, effort:nodes.effort.value };
      const { model, effort } = submitted;
      savingSelection = true; render(current); setError("");
      try {
        const result = await post("selection", { requestId:requestId("selection"), model, effort });
        if (!closed) {
          current.selection = result.selection; selectionRevision += 1;
          if (selectionDraft === submitted) selectionDraft = null;
        }
      } catch (error) { if (!closed) { if (selectionDraft === submitted) selectionDraft = null; setError(error.message); } }
      finally { savingSelection = false; if (!closed) { renderModels(); render(current); await refreshState({ quiet:true }); } }
    }
    async function goalCommand(command) {
      const response = await api(`/api/chats/${id}/send`, { method:"POST", body:JSON.stringify({ request_id:requestId("goal"), message:command }) });
      const local = (await response.json())?._meta?.[chatMeta];
      if (!closed && current && local && Object.hasOwn(local, "goal")) { current.goal = local.goal; render(current); }
    }
    const showSettings = visible => { byId("automation-settings").hidden = !visible; byId("automation-settings-toggle").setAttribute("aria-expanded", String(visible)); byId("goal-editor").hidden = true; };
    const editGoal = () => { showSettings(false); nodes.goal.value = current?.goal?.markdown || ""; byId("goal-editor").hidden = false; nodes.goal.focus(); };
    byId("automation-settings-toggle").addEventListener("click", () => showSettings(byId("automation-settings").hidden));
    byId("automation-settings-close").addEventListener("click", () => showSettings(false));
    byId("automation-add-goal").addEventListener("click", editGoal);
    byId("automation-edit-goal").addEventListener("click", editGoal);
    byId("goal-editor-close").addEventListener("click", () => { byId("goal-editor").hidden = true; });
    nodes.model.addEventListener("change", () => {
      selectionDraft = { model:nodes.model.value, effort:null };
      renderEfforts(null); selectionDraft.effort = nodes.effort.value; void saveSelection();
    });
    nodes.effort.addEventListener("change", () => { selectionDraft = { model:nodes.model.value, effort:nodes.effort.value }; void saveSelection(); });
    nodes.url.addEventListener("input", () => { nodes.pair.disabled = !nodes.url.value.trim() || !current?.selection?.model || !current?.selection?.effort; });
    nodes.goal.addEventListener("input", () => { nodes.setGoal.disabled = !nodes.goal.value.trim() || current?.goal?.status === "active"; });
    nodes.login.addEventListener("click", () => run(async () => { await post("login"); }));
    nodes.capabilities.addEventListener("click", () => run(loadModels));
    nodes.pair.addEventListener("click", () => run(async () => { await post("pair", { requestId:requestId("pair"), url:nodes.url.value.trim() }); }));
    nodes.unlink.addEventListener("click", () => run(async () => { await post("unlink", { requestId:requestId("unlink") }); nodes.url.value = ""; }));
    nodes.reveal.addEventListener("click", () => run(async () => { await post("reveal"); }));
    nodes.setGoal.addEventListener("click", () => run(async () => { await goalCommand(`/goal set ${nodes.goal.value}`); byId("goal-editor").hidden = true; }));
    nodes.toggleGoal.addEventListener("click", () => run(async () => { await goalCommand(current?.goal?.status === "active" ? "/goal stop" : "/goal run"); }));
    nodes.clearGoal.addEventListener("click", () => run(async () => { await goalCommand("/goal clear"); }));
    nodes.cancelAction.addEventListener("click", () => run(async () => { await post("action/cancel", { requestId:requestId("cancel"), actionId:current.action.id }); }));
    nodes.retryAction.addEventListener("click", () => run(async () => { await post("action/retry", { requestId:requestId("retry"), actionId:current.action.id }); }));
    void refreshState();
    timer = setInterval(() => { if (!document.hidden) void refreshState({ quiet:true }); }, 1500);
    return { close() { closed = true; clearInterval(timer); } };
  }
  function renderList() {
    const now = Date.now() + clockOffset;
    clearTimeout(presenceTimer);
    const next = chats.flatMap(chat => [chat.agentWaitingUntilMs, ...[180000,300000].map(age => chat.lastAgentCallAtMs + age)].map(deadline => deadline - now)).filter(delay => Number.isFinite(delay) && delay > 0);
    if (!document.hidden && next.length) presenceTimer = setTimeout(renderList, Math.max(1, Math.min(...next)));
    list.replaceChildren();
    document.getElementById("view-projects").setAttribute("aria-pressed", String(listMode === "projects"));
    document.getElementById("view-recent").setAttribute("aria-pressed", String(listMode === "recent"));
    if (!chats.length) {
      list.append(textNode("p", "conversation-detail", "No persisted conversations yet."));
      return;
    }
    const query = search.value.trim();
    if (query !== matchedQuery) {
      list.append(textNode("p", "conversation-detail", "Searching…")); return;
    }
    const visibleChats = chats.filter(chat => !query || matchedIds?.has(chat.id));
    if (!visibleChats.length) list.append(textNode("p", "conversation-detail", "No matching chats."));
    const groups = new Map();
    for (const chat of visibleChats) {
      const key = listMode === "projects" ? (chat.projectId || chat.projectPath || chat.workspace) : "recent";
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(chat);
    }
    for (const group of groups.values()) {
      if (listMode === "projects") {
        const heading = textNode("h2", "project-heading", group[0].workspace);
        heading.title = group[0].projectPath || group[0].workspace;
        list.append(heading);
      }
      for (const chat of group) {
      const button = document.createElement("button");
      button.type = "button"; button.className = "conversation";
      button.setAttribute("aria-current", String(chat.id === selected));
      button.title = `${chat.title} · ${chat.workspace}`;
      button.addEventListener("click", () => select(chat.id));
      const state = presence(chat.lastAgentCallAtMs, now, chat.agentWaitingUntilMs);
      const icon = textNode("span", `presence ${state}`, "");
      icon.append(presenceIcon(state));
      icon.title = state === "waiting" ? "Agent is waiting for your message" : `Agent ${state} (based on last tool call)`;
      icon.setAttribute("role", "img"); icon.setAttribute("aria-label", icon.title);
      const content = textNode("span", "conversation-main", "");
      content.append(textNode("span", "conversation-title", chat.title));
      const date = chat.lastEntryAtMs ? new Date(chat.lastEntryAtMs).toLocaleString() : "No messages";
      content.append(textNode("span", "conversation-detail", `${chat.workspace} · ${date}`));
      const dot = textNode("span", "unread", "");
      dot.hidden = chat.id === selected || chat.lastEntryEnd <= (seen[chat.id] || 0);
      dot.setAttribute("aria-label", "New chat entry");
      button.append(icon, content, dot);
      list.append(button);
      }
    }
  }
  function chatIdFromUrl() {
    const id = new URLSearchParams(location.search).get("chat");
    return id && chatIdPattern.test(id) ? id : null;
  }
  function clearSelection(message = "Select a conversation to view its chat.") {
    controller?.close(); controller = null; selected = null;
    const placeholder = textNode("div", "", message);
    placeholder.id = "placeholder";
    host.replaceChildren(placeholder);
    renderList();
  }
  function select(id, updateUrl = true) {
    if (id === selected) return;
    if (updateUrl) {
      const url = new URL(location.href);
      url.searchParams.set("chat", id);
      history.pushState(null, "", url.pathname + url.search + url.hash);
    }
    controller?.close(); controller = null; selected = id;
    host.replaceChildren();
    const shell = document.createElement("div");
    shell.className = "chat-shell";
    const scope = shell.attachShadow({ mode:"open" });
    scope.append(document.getElementById("chat-template").content.cloneNode(true));
    scope.append(document.getElementById("owner-composer-style").content.cloneNode(true));
    host.append(shell);
    const automation = createAutomationPanel(id, scope);
    const rename = document.createElement("button");
    rename.id = "rename-chat"; rename.type = "button"; rename.className = "icon-button";
    rename.setAttribute("aria-label", "Rename chat"); rename.title = "Rename chat";
    rename.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 16 12-12 4 4-12 12H4ZM14 6l4 4"/></svg>`;
    scope.querySelector(".header-actions").prepend(rename);
    const renameForm = document.createElement("form"); renameForm.id = "rename-form"; renameForm.hidden = true;
    renameForm.innerHTML = `<label for="chat-name">Chat name</label><input id="chat-name" maxlength="200" autocomplete="off"><p>Leave empty to show the latest message.</p><div class="automation-actions"><button type="submit">Save name</button><button type="button" id="cancel-rename">Cancel</button></div><p id="rename-error" role="alert" hidden></p>`;
    scope.querySelector(".header").after(renameForm);
    rename.addEventListener("click", () => {
      renameForm.hidden = false;
      scope.querySelector("#chat-name").value = chats.find(chat => chat.id === id)?.customTitle || "";
      scope.querySelector("#chat-name").focus();
    });
    scope.querySelector("#cancel-rename").addEventListener("click", () => { renameForm.hidden = true; });
    renameForm.addEventListener("submit", async event => {
      event.preventDefault();
      const submit = renameForm.querySelector('[type="submit"]'); submit.disabled = true;
      const error = scope.querySelector("#rename-error"); error.hidden = true;
      try {
        const payload = await (await api(`/api/chats/${id}/title`, { method:"POST", body:JSON.stringify({ title:scope.querySelector("#chat-name").value }) })).json();
        const chat = chats.find(chat => chat.id === id);
        if (chat) Object.assign(chat, payload);
        renameForm.hidden = true;
        renderList(); void refresh();
      } catch (failure) { error.textContent = failure.message; error.hidden = false; }
      finally { submit.disabled = false; }
    });
    const key = `owner-chat-widget-v1:${id}`;
    const bridge = {
      getState() { try { return JSON.parse(localStorage.getItem(key) || "{}"); } catch { return {}; } },
      setState(value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} },
      reportSize() {},
      async callTool(name, args) {
        let path = `/api/chats/${id}`;
        let options = {};
        if (name === "chat_ui_state") {
          const query = new URLSearchParams();
          if (args.revision) query.set("revision", args.revision);
          if (args.before !== undefined) query.set("before", args.before);
          if (query.size) path += `?${query}`;
        } else if (name === "chat_ui_send") {
          path += "/send";
          options = { method:"POST", body:JSON.stringify({request_id:args.request_id, message:args.message}) };
        } else if (name === "chat_ui_file") {
          path += `/file?${new URLSearchParams({href:args.href})}`;
        } else throw new Error("Unknown chat operation");
        const payload = await (await api(path, options)).json();
        if (name === "chat_ui_state") {
          const end = chats.find(chat => chat.id === id)?.lastEntryEnd;
          remember(id, end);
        }
        return payload;
      },
      async downloadFile(resource) {
        const response = await api(`/api/files?${new URLSearchParams({uri:resource.uri})}`);
        const blob = await response.blob();
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = resource.name || "download";
        link.click();
        setTimeout(() => URL.revokeObjectURL(link.href), 30000);
      },
      async openLink(href) {
        const url = new URL(href, location.href);
        if (!["https:", "http:", "mailto:"].includes(url.protocol)) throw new Error("Unsupported link");
        window.open(url.href, "_blank", "noopener,noreferrer");
      },
      async copyMessage(markdown) {
        if (!navigator.clipboard?.writeText) throw new Error("Clipboard unavailable");
        await navigator.clipboard.writeText(markdown);
      },
      async copyChat() {
        if (!navigator.clipboard?.writeText) throw new Error("Clipboard unavailable");
        const response = await api(`/api/chats/${id}/markdown`);
        await navigator.clipboard.writeText(await response.text());
      }
    };
    const chatController = window.mountCodexifyChat(scope, bridge);
    chatController.setAvailable(true);
    controller = { close() { automation.close(); chatController.close(); } };
    renderList();
  }
  function selectFromUrl() {
    const id = chatIdFromUrl();
    if (!id) {
      if (selected !== null) clearSelection();
    } else if (chats.some(chat => chat.id === id)) {
      select(id, false);
    } else if (selected !== null || chats.length) {
      clearSelection("Conversation is no longer available.");
    }
  }
  async function refresh() {
    if (document.hidden) return;
    const query = search.value.trim();
    if (pendingList?.query === query) return;
    const sequence = ++listRequest;
    pendingList = { sequence, query };
    try {
      const payload = await (await api(`/api/chats${query ? `?${new URLSearchParams({ q:query })}` : ""}`)).json();
      if (sequence !== listRequest || query !== search.value.trim()) return;
      chats = payload.chats || [];
      matchedQuery = query; matchedIds = new Set(payload.matchedChatIds || []);
      if (Number.isSafeInteger(payload.serverTimeMs)) clockOffset = payload.serverTimeMs - Date.now();
      showError("");
      selectFromUrl();
      renderList();
    } catch (error) { if (sequence === listRequest) showError(error.message || "Chat list unavailable"); }
    finally { if (pendingList?.sequence === sequence) pendingList = null; }
  }
  search.addEventListener("input", () => {
    clearTimeout(searchTimer); ++listRequest; pendingList = null; renderList();
    searchTimer = setTimeout(refresh, 200);
  });
  for (const mode of ["projects", "recent"]) document.getElementById(`view-${mode}`).addEventListener("click", () => {
    listMode = mode;
    try { localStorage.setItem("owner-chat-list-view-v1", mode); } catch {}
    renderList();
  });
  window.addEventListener("popstate", selectFromUrl);
  window.addEventListener("focus", () => { renderList(); void refresh(); });
  document.addEventListener("visibilitychange", () => { renderList(); if (!document.hidden) void refresh(); });
  window.addEventListener("storage", event => {
    if (event.key === "owner-chat-seen-v1") {
      try { seen = JSON.parse(event.newValue || "{}"); } catch {}
      renderList();
    }
  });
  if (!token) showError("Open this page using the URL printed by `codexify chat`.");
  else { void refresh(); setInterval(refresh, 2000); setInterval(renderList, 30000); }
})();
</script>
